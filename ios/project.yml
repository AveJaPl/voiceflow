name: VoiceFlowIOS
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: H7DS3ZG67S
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  VoiceFlowApp:
    type: application
    platform: iOS
    sources:
      - path: VoiceFlowApp
      - path: Shared
      # Kontrakt ramek WS wspólny z macOS — JEDNO źródło prawdy, nie kopia.
      # Fixture'y są tylko dla testów — nie ma powodu, żeby ważyły w apce.
      - path: ../shared/wire
        excludes: ["fixtures/**"]
      # Tablica pokoju liczona TYM SAMYM kodem co na Macu — zakładka „Pokoje”
      # i strona „Pokój” na Macu patrzą na tę samą sesję.
      - path: ../shared/board
    info:
      path: VoiceFlowApp/Info.plist
      properties:
        CFBundleDisplayName: VoiceFlow
        CFBundleShortVersionString: "0.4.3"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "VoiceFlow potrzebuje mikrofonu, żeby transkrybować dyktowanie na żywo."
        NSSpeechRecognitionUsageDescription: "VoiceFlow potrzebuje rozpoznawania mowy Apple do transkrypcji polskiej."
        # Bez tego klucza iOS PO CICHU ubija połączenia do adresów w sieci
        # lokalnej (relay na Macu, np. ws://192.168.x.x) — system nie może
        # pokazać pytania o zgodę, więc nie pyta i odmawia. Objaw: wieczne
        # „łączę z Makiem" bez żadnego błędu. Znalezione na żywym telefonie
        # 2026-08-12.
        NSLocalNetworkUsageDescription: "VoiceFlow łączy się z Twoim Makiem w sieci lokalnej, żeby przesyłać dyktowanie i podgląd okien."
        # ATS: produkcyjny relay chodzi po `wss://` i tego NIE ruszamy. Wyjątek
        # dotyczy WYŁĄCZNIE sieci lokalnej i loopbacku — bez niego nie da się
        # przetestować apki przeciw relayowi na `ws://127.0.0.1` (iOS odrzuca
        # takie połączenie bez błędu, ekran po prostu wisi na „łączę…").
        # To jest też warunek konieczny dla bezpośredniego połączenia po LAN,
        # przewidzianego w planie §6. NIE jest to `NSAllowsArbitraryLoads`:
        # ruch do internetu dalej musi być szyfrowany.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # PIVOT #2 (docs/plans/ios-voiceflow-app.md §7): klawiatura otwiera
        # apkę kontenerową przez `extensionContext?.open(voiceflow://dictate)`
        # — mikrofon jest zablokowany w samym rozszerzeniu, więc to jedyny
        # sposób, żeby w ogóle nagrać dźwięk.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.avejapl.voiceflow.ios
            CFBundleURLSchemes:
              - voiceflow
        UIAppFonts:
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - JetBrainsMono-Regular.ttf
    entitlements:
      path: VoiceFlowApp/VoiceFlowApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.avejapl.voiceflow.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.avejapl.voiceflow.ios
        PRODUCT_NAME: VoiceFlow
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.4.3"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: VoiceFlowKeyboard
        embed: true

  VoiceFlowKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: VoiceFlowKeyboard
      - path: Shared
    info:
      path: VoiceFlowKeyboard/Info.plist
      properties:
        CFBundleDisplayName: VoiceFlow
        CFBundleShortVersionString: "0.4.3"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeyboardViewController
          NSExtensionAttributes:
            # PIVOT #2 2026-08-10 (docs/plans/ios-voiceflow-app.md §7): z
            # powrotem `false` — klawiatura znów jest panelem "tylko
            # mikrofon", nie realnym IME (pivot QWERTY z §6 odrzucony, mur
            # sandboxa na mikrofonie w rozszerzeniu okazał się nie do obejścia).
            IsASCIICapable: false
            PrimaryLanguage: pl-PL
            PrefersRightToLeft: false
            RequestsOpenAccess: true
        UIAppFonts:
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - JetBrainsMono-Regular.ttf
    entitlements:
      path: VoiceFlowKeyboard/VoiceFlowKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.avejapl.voiceflow.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.avejapl.voiceflow.ios.keyboard
        PRODUCT_NAME: VoiceFlowKeyboard
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.4.3"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES

  VoiceFlowTests:
    # Logic-only test bundle (celowo bez host app / TEST_HOST): kompiluje
    # `Shared/TextDiffer.swift` bezpośrednio, bez zależności od UIKit/apki —
    # hardware-free, odpala się w Simulatorze bez fizycznego urządzenia
    # (kryterium weryfikacji #3 z planu).
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoiceFlowTests
      - path: Shared
      # PIVOT #2 (docs/plans/ios-voiceflow-app.md §7): klawiatura QWERTY
      # odrzucona, `KeyboardLayout.swift`/`KeyboardInputController.swift`
      # usunięte — cała testowalna logika tego zadania (`PendingInsert`,
      # `TextDiffer`) jest już w `Shared/`, więc nic dodatkowego tu nie trzeba.
      #
      # Zakładka "Mac" (docs/plans/2026-08-11-ios-zdalne-sterowanie-mac.md):
      # dokładamy kontrakt wire i rdzeń zdalnej sesji. CELOWO bez `VoiceFlowApp`
      # w całości — ten katalog zawiera `@main`, którego nie wolno wciągać do
      # bundle'a testowego.
      - path: ../shared/wire
        excludes: ["fixtures/**"]
      - path: ../shared/wire/fixtures
        buildPhase: resources
      - path: VoiceFlowApp/Remote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.avejapl.voiceflow.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VoiceFlowApp:
    build:
      targets:
        VoiceFlowApp: all
        VoiceFlowKeyboard: all
        VoiceFlowTests: [test]
    test:
      targets:
        - VoiceFlowTests
    run:
      config: Debug
