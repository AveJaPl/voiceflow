name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync
      - name: Run tests
        # The suite mocks all hardware: no GPU, microphone, or display needed.
        run: uv run pytest -q
