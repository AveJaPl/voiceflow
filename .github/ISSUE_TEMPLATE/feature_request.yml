name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check the [Roadmap](https://github.com/AveJaPl/voiceflow#roadmap) first; many items already have a tracking issue you can comment on.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and where voiceflow gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms this concerns
      multiple: true
      options:
        - Linux
        - Windows
        - macOS
        - Android
        - iOS
        - All
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
