[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceflow"
version = "0.1.0"
description = "Local, GPU-accelerated voice dictation for Linux. Press a hotkey, speak, get text in any window. Whisper on your own hardware — no cloud, no subscription."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Filip Piątek" }]
keywords = ["dictation", "speech-to-text", "whisper", "wayland", "gnome", "voice-typing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "faster-whisper",
  "numpy",
  "PyYAML",
  "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Repository = "https://github.com/AveJaPl/voiceflow"
Issues = "https://github.com/AveJaPl/voiceflow/issues"

[project.scripts]
voiceflow = "voiceflow.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/voiceflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
