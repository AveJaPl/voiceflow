name: VoiceFlow
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Stała tożsamość podpisu, NIE ad-hoc: przy ad-hoc każdy build zmienia CDHash,
    # więc macOS traktuje aplikację jak nową i kasuje nadane uprawnienia
    # (Dostępność, Monitorowanie danych wejściowych) po każdym przebudowaniu.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: H7DS3ZG67S
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
targets:
  VoiceFlow:
    type: application
    platform: macOS
    sources:
      - path: VoiceFlow
      # Kontrakt własnego serwera transkrypcji — wspólny z iOS (WAV, multipart,
      # adres końcówki), patrz server/README.md.
      - path: ../shared/asr/TranscriptionWire.swift
      # Matematyka tablicy pokoju — również wspólna z iOS, z tego samego
      # powodu: dwie kopie liczyłyby udziały inaczej i nikt by tego nie zauważył.
      - path: ../shared/board/RoomBoard.swift
    info:
      path: VoiceFlow/Info.plist
      properties:
        LSUIElement: true
        # Od macOS 15 dostęp do sieci lokalnej wymaga ZGODY użytkownika i obu
        # tych kluczy. Bez nich przeglądanie Bonjour nic nie znajduje — bez
        # błędu i bez logu, więc wygląda jak „nikt nie rozgłasza pokoju".
        NSLocalNetworkUsageDescription: "VoiceFlow szuka w Twojej sieci pokoi dyktowania rozgłaszanych przez inne komputery, żebyś nie musiał przepisywać kodu."
        NSBonjourServices:
          - _voiceflow._tcp
          - _voiceflow-asr._tcp
        NSMicrophoneUsageDescription: "VoiceFlow potrzebuje mikrofonu, żeby transkrybować dyktowanie na żywo."
        NSSpeechRecognitionUsageDescription: "VoiceFlow potrzebuje rozpoznawania mowy Apple do transkrypcji polskiej i angielskiej."
        NSAppleEventsUsageDescription: "VoiceFlow wysyła zdarzenia klawiatury i schowka, żeby wstawić przetranskrybowany tekst w aktywnej aplikacji."
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "1"
    entitlements:
      path: VoiceFlow/VoiceFlow.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.avejapl.voiceflow
        PRODUCT_NAME: VoiceFlow
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        # Wymagane do notaryzacji (Developer ID). Debug dostaje
        # get-task-allow od Xcode automatycznie, więc debugowanie działa.
        ENABLE_HARDENED_RUNTIME: YES
        # whisper.cpp (WhisperSpeechEngine) jest linkowany STATYCZNIE z
        # third_party/whisper-macos — buduje je tools/build-whisper-macos.sh z
        # tego samego submodułu, którego używa Android. Gotowa .app nie ma
        # żadnej zależności od Homebrew (wcześniej `otool -L` pokazywał
        # /opt/homebrew/opt/whisper-cpp/lib/libwhisper.1.dylib i apka nie
        # startowała na Macu bez `brew install whisper-cpp`).
        SWIFT_OBJC_BRIDGING_HEADER: VoiceFlow/Core/VoiceFlow-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../third_party/whisper-macos/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../third_party/whisper-macos/lib
        OTHER_LDFLAGS: -lwhisper -lc++ -framework Accelerate -framework Metal -framework MetalKit
        # TYLKO arm64: biblioteka statyczna jest budowana dla Apple Silicon
        # (Metal). Intel nie jest wspierany przez port.
        ARCHS: arm64
  VoiceFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VoiceFlowTests
    dependencies:
      - target: VoiceFlow
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.avejapl.voiceflow.tests
        GENERATE_INFOPLIST_FILE: YES
        # Testy linkują (przez `@testable import VoiceFlow`) obiekty VoiceFlow-a, które
        # same odwołują się do libwhisper — bez tego link testowego bundle'a
        # nie rozwiąże symboli whisper_* (patrz target VoiceFlow wyżej).
        HEADER_SEARCH_PATHS: $(SRCROOT)/../third_party/whisper-macos/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../third_party/whisper-macos/lib
        OTHER_LDFLAGS: -lwhisper -lc++ -framework Accelerate -framework Metal -framework MetalKit
        ARCHS: arm64
schemes:
  VoiceFlow:
    build:
      targets:
        VoiceFlow: all
        VoiceFlowTests: [test]
    test:
      targets:
        - VoiceFlowTests
    run:
      config: Debug
