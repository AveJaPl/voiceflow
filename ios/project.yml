name: VoiceFlowIOS
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: H7DS3ZG67S
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    TARGETED_DEVICE_FAMILY: "1"
packages:
  # whisper na urządzeniu: Core ML / Neural Engine. Ten sam model co Mac
  # (large-v3-turbo) na iPhone 15 Pro i nowszych, small na starszych — patrz
  # Core/WhisperModelCatalog.swift. MIT.
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.0.0"
targets:
  VoiceFlowApp:
    type: application
    platform: iOS
    sources:
      - path: VoiceFlowApp
      - path: Shared
      # Tablica pokoju liczona TYM SAMYM kodem co na Macu — zakładka „Pokoje”
      # i strona „Pokój” na Macu patrzą na tę samą sesję.
      - path: ../shared/board
    info:
      path: VoiceFlowApp/Info.plist
      properties:
        CFBundleDisplayName: VoiceFlow
        CFBundleShortVersionString: "0.5.2"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "VoiceFlow potrzebuje mikrofonu, żeby transkrybować dyktowanie na żywo."
        NSSpeechRecognitionUsageDescription: "VoiceFlow potrzebuje rozpoznawania mowy Apple do transkrypcji polskiej."
        # Własny serwer transkrypcji w sieci lokalnej (Zaawansowane) — bez
        # tego klucza iOS po cichu ubija połączenia do adresów LAN.
        NSLocalNetworkUsageDescription: "VoiceFlow może wysyłać nagranie do Twojego własnego serwera transkrypcji w sieci lokalnej, jeśli go ustawisz."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # PIVOT #2 (docs/plans/ios-voiceflow-app.md §7): klawiatura otwiera
        # apkę kontenerową przez `extensionContext?.open(voiceflow://dictate)`
        # — mikrofon jest zablokowany w samym rozszerzeniu, więc to jedyny
        # sposób, żeby w ogóle nagrać dźwięk.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.avejapl.voiceflow.ios
            CFBundleURLSchemes:
              - voiceflow
        UIAppFonts:
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - JetBrainsMono-Regular.ttf
    entitlements:
      path: VoiceFlowApp/VoiceFlowApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.avejapl.voiceflow.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.avejapl.voiceflow.ios
        PRODUCT_NAME: VoiceFlow
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: VoiceFlowKeyboard
        embed: true
      - package: WhisperKit
        product: WhisperKit

  VoiceFlowKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: VoiceFlowKeyboard
      - path: Shared
    info:
      path: VoiceFlowKeyboard/Info.plist
      properties:
        CFBundleDisplayName: VoiceFlow
        CFBundleShortVersionString: "0.5.2"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeyboardViewController
          NSExtensionAttributes:
            # PIVOT #2 2026-08-10 (docs/plans/ios-voiceflow-app.md §7): z
            # powrotem `false` — klawiatura znów jest panelem "tylko
            # mikrofon", nie realnym IME (pivot QWERTY z §6 odrzucony, mur
            # sandboxa na mikrofonie w rozszerzeniu okazał się nie do obejścia).
            IsASCIICapable: false
            PrimaryLanguage: pl-PL
            PrefersRightToLeft: false
            RequestsOpenAccess: true
        UIAppFonts:
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - JetBrainsMono-Regular.ttf
    entitlements:
      path: VoiceFlowKeyboard/VoiceFlowKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.avejapl.voiceflow.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.avejapl.voiceflow.ios.keyboard
        PRODUCT_NAME: VoiceFlowKeyboard
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES

  VoiceFlowTests:
    # Logic-only test bundle (celowo bez host app / TEST_HOST): kompiluje
    # `Shared/TextDiffer.swift` bezpośrednio, bez zależności od UIKit/apki —
    # hardware-free, odpala się w Simulatorze bez fizycznego urządzenia
    # (kryterium weryfikacji #3 z planu).
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoiceFlowTests
      - path: Shared
      # Cała testowalna logika (`PendingInsert`, `TextDiffer`) jest w `Shared/`.
      # CELOWO bez `VoiceFlowApp` w całości — ten katalog zawiera `@main`,
      # którego nie wolno wciągać do bundle'a testowego.
      - path: VoiceFlowApp/Core/WhisperModelCatalog.swift
      # Ta sama próbka co w testach Maca — jeden wzorzec tekstu dla obu platform.
      - path: ../macos/VoiceFlowTests/Fixtures/dyktowanie-pl.wav
        buildPhase: resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.avejapl.voiceflow.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VoiceFlowApp:
    build:
      targets:
        VoiceFlowApp: all
        VoiceFlowKeyboard: all
        VoiceFlowTests: [test]
    test:
      targets:
        - VoiceFlowTests
    run:
      config: Debug
