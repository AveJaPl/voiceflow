name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the [Known limitations](https://github.com/AveJaPl/voiceflow#known-limitations) first.
        Security problems go through [private reporting](https://github.com/AveJaPl/voiceflow/security/advisories/new), not here.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: voiceflow version
      description: The release you installed (e.g. 0.6.3 or mac 0.8.0), or the commit if you built from source.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and desktop / compositor
      placeholder: "Ubuntu 26.04, GNOME 50 on Wayland"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: "NVIDIA RTX 3070, driver 580 (or: no GPU)"
  - type: input
    id: model
    attributes:
      label: Model and device from your config
      description: "`model.name` and `model.device` from ~/.config/voiceflow/config.yaml"
      placeholder: "large-v3-turbo, cuda"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, if you have them.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Linux: `voiceflow status` and `journalctl --user -u voiceflow -n 200`.
        Windows: the end of `%LOCALAPPDATA%\voiceflow\daemon.log`.
        Remove anything you consider private (dictated text appears in some log lines).
      render: text
