server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Language negotiation at the root only: Polish browsers land on /pl/,
    # everyone else on /en/. Both URLs stay directly linkable for SEO
    # (hreflang tags live in the pages themselves).
    location = / {
        if ($http_accept_language ~* "^pl|[-,;\s]pl") {
            return 302 /pl/;
        }
        return 302 /en/;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }
}
