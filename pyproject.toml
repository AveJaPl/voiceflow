[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceflow"
version = "0.5.0"
description = "Local, GPU-accelerated voice dictation for Linux and Windows. Press a hotkey, speak, get text in any window. Whisper on your own hardware — no cloud, no subscription."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Filip Piątek" }]
keywords = ["dictation", "speech-to-text", "whisper", "wayland", "gnome", "voice-typing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "faster-whisper",
  "numpy",
  "PyYAML",
  "websockets",
  "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # CTranslate2's Windows wheel links CUDA dynamically but ships no cuBLAS or
  # cuDNN, so without these GPU transcription dies at the first encoder call
  # with "cublas64_12.dll is not found" - the same wheels Linux already pulls.
  "nvidia-cublas-cu12; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "nvidia-cudnn-cu12; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sounddevice; sys_platform == 'win32'",
  "pycaw; sys_platform == 'win32'",
  "comtypes; sys_platform == 'win32'",
  # Core Audio identifies a session by process id only; psutil turns that into
  # the executable name the config is written in. pycaw pulls it in too, but we
  # import it directly, so it is declared directly.
  "psutil; sys_platform == 'win32'",
  # The desktop window. Linux has the GTK4/libadwaita app in app/; PyGObject
  # publishes no Windows wheel at all, so the Windows UI is Qt.
  "PySide6; sys_platform == 'win32'",
  # Room discovery on the local network. Linux does this through Avahi, which
  # the GTK application already has on the bus; Windows has no Avahi and no
  # Python binding to its own DNS-SD, so it speaks the same protocol itself.
  "zeroconf; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/AveJaPl/voiceflow"
Issues = "https://github.com/AveJaPl/voiceflow/issues"

[project.scripts]
voiceflow = "voiceflow.cli:main"

# A gui-script gets a launcher bound to pythonw.exe, so opening the window from
# the Start Menu never flashes a console behind it.
[project.gui-scripts]
voiceflow-app = "voiceflow.gui.app:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/voiceflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
